name: PR Lint and Unit Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  merge_group:
    branches:
      - main
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  lint-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx @biomejs/biome check static/js/
      - name: Run unit tests
        run: |
          mkdir -p test-results
          set -o pipefail
          npx vitest run --reporter=verbose 2>&1 | tee test-results/vitest-verbose.log
      - name: Upload unit test results
        if: ${{ failure() && hashFiles('test-results/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: test-results/
          retention-days: 7