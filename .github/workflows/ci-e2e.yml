name: PR E2E Tests

on:
  workflow_dispatch:
  merge_group:
    branches:
      - main
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright and prepare app assets
        run: npx playwright install --with-deps chromium && make prepare-sqljs && make gen-env
      - name: Start static server
        run: npx serve static -l 8111 --cors &
      - name: Wait for static server and verify generated assets
        run: >-
          npx wait-on http://localhost:8111 --timeout 30000 &&
          curl --fail --silent --show-error --head http://localhost:8111/js/env.js &&
          curl --fail --silent --show-error --head http://localhost:8111/js/sql-wasm.js &&
          curl --fail --silent --show-error --head http://localhost:8111/js/sql-wasm.wasm
      - name: Run Playwright E2E tests
        run: npx playwright test --reporter=github,html
      - name: Stop static server
        if: always()
        run: pkill -f "serve static -l 8111" || true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14