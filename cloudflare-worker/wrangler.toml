name = "gmail-proxy"
main = "gmail-proxy.js"
compatibility_date = "2024-09-25"

[[durable_objects.bindings]]
name = "AUTH_RESULTS"
class_name = "AuthResultStore"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RequestRateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AuthResultStore"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RequestRateLimiter"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = false

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[vars]
# Secrets are set via `wrangler secret put`:
# GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, REDIRECT_URI, ALLOWED_ORIGIN
